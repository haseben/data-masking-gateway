# 数据库脱敏 MCP 网关 - Docker Compose
# 使用方式：
#   首次运行: docker compose run --rm gateway python init.py  # 初始化向导
#   启动服务: docker compose up -d
#   查看日志: docker compose logs -f
#   停止:     docker compose down

services:
  gateway:
    build: .
    image: data-masking-gateway:latest
    container_name: masking-gateway
    restart: unless-stopped

    ports:
      - "127.0.0.1:8765:8765"  # 仅监听本地，需通过 Nginx 或 SSH 隧道访问

    env_file:
      - .env  # 环境变量（HMAC_SECRET, MYSQL_PASSWORD 等）

    volumes:
      # 配置文件（修改后重启容器生效）
      - ./config:/app/config:ro
      # 审计日志持久化
      - ./logs:/app/logs
      # Token 文件
      - ./tokens.json:/app/tokens.json:ro

    networks:
      - gateway-net

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8765/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  gateway-net:
    driver: bridge
